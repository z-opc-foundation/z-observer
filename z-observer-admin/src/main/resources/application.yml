server:
  port: 8080

z:
  observer:
    # ===== 管理面入站鉴权（卡 TASK-20261022-017 第 1 项）=====
    # 管理面此前**零鉴权**：读端点匿名可读，且 POST /api/rules、/api/silences、
    # /api/inhibits 三个写端点也开着 ⇒ 可写端点比可读端点危险得多。
    # ⇒ 整条 servlet 链上挂 bearer 闸门（读面 + 写面一起挡）。
    # ⚠ **这里没有 token 字段**：密钥只从环境变量 / Secret 取
    #    （Z_OBSERVER_ADMIN_AUTH_TOKEN），进仓即事故。
    # ⚠ 缺密钥 ⇒ **启动失败**（fail closed）：宁可起不来，也不要「以为加了鉴权、
    #    其实没加」。要临时关掉请显式设 enabled=false（会打 warn）。
    admin:
      auth:
        enabled: ${Z_OBSERVER_ADMIN_AUTH_ENABLED:true}
        # 免鉴权的路径前缀。默认只有内部健康端点（k8s 探针打它，探针不带 token）。
        # ⚠ 别把业务查询面加进来 —— 免鉴权端点就是公开面。
        excluded-paths: []
    # 收端监听端口（SDK 按这个地址上报）
    collector-port: 14300
    # D2 过渡方案 B：M1 不自建时序存储，直读 z-env 已有 Prometheus 本体
    prometheus-url: ${Z_OBSERVER_PROMETHEUS_URL:http://127.0.0.1:9090}
    evaluate-interval-millis: 15000
    log-max-docs: 200000
    log-retention-millis: 86400000
    trace-max-traces: 20000
    trace-retention-millis: 7200000
    # D1 采集：常驻服务 pull。target 优先从 z-config naming 发现，
    # 订阅的服务名填在这里；naming 客户端不可用时退回 scrape-urls。
    # 两个都空 = 采集层空转（会打一条 warn，不静默）。
    naming-services: []
    scrape-urls: []
    metrics-port: 9100
    scrape-interval-millis: 15000
    # 告警规则（M1 验收：进程挂掉 60 秒内通知到人）。
    # 确认时长 30s + 评估间隔 15s = 最坏 45s 进 FIRING，留出余量仍在 60s 内。
    #
    # **两段确认有两把闸门**（缺一不可）：
    #   · 时长闸门 `for-duration-millis`：条件要连续成立这么久；
    #   · 计数闸门 `for-hits`：条件要连续命中 N 个**评估周期**。
    # 命中-未命中交替的抖动场景，连续命中数永远攒不到 N ⇒ 永远不进 FIRING。
    # ⚠ `for-hits` 不得大于 `1 + for-duration-millis / evaluate-interval-millis`，
    #   否则计数闸门会把 60 秒口径撑破（RuleLoadingTest 有一条断言钉住这个不等式）。
    rules:
      - id: process_absent
        name: 进程消失
        severity: critical
        expression: ABSENT
        promql: up{job="z-observer"}
        for-duration-millis: 30000
        for-hits: 2
        # Prometheus 的 instant 查询默认回看 5 分钟，进程刚挂时结果里仍有最后一个点。
        # 只认「结果为空」的话这条规则要等满 5 分钟才成立，60 秒口径直接不成立。
        absent-grace-millis: 30000
        summary: 进程消失（查不到时序）
        description: >-
          Prometheus 因 staleness 把时序从结果里删掉，所以 up==0 恰恰在进程彻底
          挂掉时失效。这里用 absent：查不到即告警。默认只覆盖 z-observer 收端
          自身，纳管其它服务时按 naming-services 里每个服务加一条。
      - id: collector_target_down
        name: 采集目标不可达
        severity: warning
        expression: THRESHOLD
        promql: up{job=~"z-.*"}
        condition: LT
        threshold: 1
        group-by:
          - job
          - instance
        for-duration-millis: 30000
        for-hits: 2
        summary: 目标抓不到
        description: 目标还在被发现结果里，但这一轮抓取失败或 up 为 0。
      # 组合布尔（多指标 and）：两个子条件必须对**同一组标签**同时成立才算命中。
      # 「有坏帧」单独看意义不大（可能是启动瞬间的一次错帧）；加上「确实在收帧」
      # 之后才是「当前正在发生的坏帧」—— 与「错误率高 + 请求量 > 0」同一套路。
      # 指标是收端自己在 /metrics 上真实暴露的（见 SelfMetricsController）。
      - id: observer_frames_rejected
        name: 收端收到帧但帧被拒
        severity: warning
        expression: BOOLEAN
        conditions:
          - promql: rate(z_observer_frames_total[5m])
            condition: GT
            threshold: 0
          - promql: rate(z_observer_frames_rejected_total[5m])
            condition: GT
            threshold: 0
        group-by:
          - job
          - instance
        for-duration-millis: 30000
        for-hits: 2
        summary: 帧被拒（有流量时才看）
        description: >-
          rate(z_observer_frames_total[5m]) > 0 表示当前确实在收帧；
          rate(z_observer_frames_rejected_total[5m]) > 0 表示解码或结构对不上。
          两者对同一组标签同时成立 ⇒ 客户端编码/协议有问题。

    # ================= 通知出口（告警 → 人）=================
    # 口径：出口唯一走 z-msg 渠道屏蔽层（跨进程 HTTP），凭据运行时从 z-mist 取，
    # 本文件里**不出现任何凭据**。z-msg 不可用时：重试 → 本地落盘待发 → 后台补发，
    # 绝不静默丢。
    notify:
      # 总开关。关掉时只有写日志的兜底渠道（收端照常起得来）。
      enabled: ${Z_OBSERVER_NOTIFY_ENABLED:false}
      z-msg:
        # z-msg 服务地址。空 = 不装这条通道。
        base-url: ${Z_OBSERVER_ZMSG_BASE_URL:}
        # 投递端点。默认批量提交面（固定告警走 z-msg 模板，见需求 009 D4）。
        send-path: ${Z_OBSERVER_ZMSG_SEND_PATH:/api/msg/batch/submit}
        # 目标通道：SMS / IM_DINGTALK / WEBHOOK …
        channel: ${Z_OBSERVER_ZMSG_CHANNEL:SMS}
        # 业务类型，对应 z-msg 侧模板。
        biz-type: ${Z_OBSERVER_ZMSG_BIZ_TYPE:z.observer.alert}
        # 收件人的 z-mist 引用（group/namespace/secretKey）。生产走这个。
        receiver-ref: ${Z_OBSERVER_ZMSG_RECEIVER_REF:}
        # 直填收件人。仅本地演练用；生产不填（填了就是明文凭据进配置）。
        receiver-direct: ${Z_OBSERVER_ZMSG_RECEIVER:}
        connect-timeout-millis: ${Z_OBSERVER_ZMSG_CONNECT_TIMEOUT_MS:3000}
        read-timeout-millis: ${Z_OBSERVER_ZMSG_READ_TIMEOUT_MS:5000}
      mist:
        # z-mist 服务地址。空 = 不装配取密件器。
        base-url: ${Z_OBSERVER_MIST_BASE_URL:}
        group: ${Z_OBSERVER_MIST_GROUP:DEFAULT_GROUP}
        namespace: ${Z_OBSERVER_MIST_NAMESPACE:}
        connect-timeout-millis: ${Z_OBSERVER_MIST_CONNECT_TIMEOUT_MS:3000}
        read-timeout-millis: ${Z_OBSERVER_MIST_READ_TIMEOUT_MS:5000}
      resilient:
        # 总尝试次数（含首次）。
        max-attempts: ${Z_OBSERVER_NOTIFY_MAX_ATTEMPTS:3}
        # 退避基数（毫秒）。
        backoff-millis: ${Z_OBSERVER_NOTIFY_BACKOFF_MS:500}
        # 待发通知的本地暂存目录（进程重启也不丢）。
        spool-dir: ${Z_OBSERVER_NOTIFY_SPOOL_DIR:./data/notify-spool}
        # 补发扫描间隔（毫秒）。
        replay-interval-millis: ${Z_OBSERVER_NOTIFY_REPLAY_INTERVAL_MS:10000}
        # 补发次数用尽后标记为未送达（挪进 failed 目录留痕，不删）。
        max-replay-attempts: ${Z_OBSERVER_NOTIFY_MAX_REPLAY_ATTEMPTS:20}

logging:
  level:
    com.zifang.z.observer: INFO
